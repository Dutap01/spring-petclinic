# Jenkins Pod가 kubectl로 was-ns의 petclinic Deployment를 배포/롤백할 수 있도록 권한 부여
apiVersion: v1
kind: ServiceAccount
metadata:
  name: jenkins
  namespace: jenkins-ns
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: petclinic-deployer
  namespace: was-ns
rules:
- apiGroups: ["apps"]
  resources: ["deployments"]          # apply(create/patch), annotate, rollout undo
  verbs: ["get", "list", "watch", "create", "patch", "update"]
- apiGroups: [""]
  resources: ["services"]             # petclinic-svc도 같은 yaml로 apply
  verbs: ["get", "list", "create", "patch", "update"]
- apiGroups: ["apps"]
  resources: ["replicasets"]          # rollout status / history / undo
  verbs: ["get", "list", "watch"]
- apiGroups: [""]
  resources: ["pods"]
  verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: jenkins-petclinic-deployer
  namespace: was-ns
subjects:
- kind: ServiceAccount
  name: jenkins
  namespace: jenkins-ns
roleRef:
  kind: Role
  name: petclinic-deployer
  apiGroup: rbac.authorization.k8s.io
