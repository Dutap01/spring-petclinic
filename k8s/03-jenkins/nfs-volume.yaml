# Jenkins 홈(/var/jenkins_home) - NFS 서버(192.168.56.107)의 /nfs/shared
# Retain: PV를 지워도 NFS의 플러그인/자격증명(dockerCredentials)은 남음
apiVersion: v1
kind: PersistentVolume
metadata:
  name: nfs-pv
spec:
  capacity:
    storage: 5Gi
  volumeMode: Filesystem
  accessModes:
    - ReadWriteMany
  persistentVolumeReclaimPolicy: Retain
  nfs:
    path: /nfs/shared
    server: 192.168.56.107
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: nfs-pvc
  namespace: jenkins-ns
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: ""
  volumeName: nfs-pv
  resources:
    requests:
      storage: 5Gi
